<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SpecShield QA reel</title>
<!--
  The 40-second SpecShield QA reel, 1920x1080 at 60 fps. Every frame is a pure function of time:
  window.renderFrame(k) draws output frame k from footage captured out of the real app
  (capture.mjs, shots.mjs: 180 fps under virtual time) and averages its three subframes into
  motion blur. Camera moves, the themed transitions (LED dot-matrix wipe, particle dissolve,
  scanner beam, shield portal), the title, the cursor and the end card are drawn here.
  window.renderAudio() renders the score offline and returns a base64 WAV. render.mjs drives both.
-->
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos" />
<style>
@font-face {
  font-family: "Inter";
  font-weight: 100 900;
  font-display: block;
  src: url("node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
}
@font-face {
  font-family: "Geist Pixel Circle";
  font-display: block;
  src: url("app-assets/fonts/GeistPixel-Circle.woff2") format("woff2");
}
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
canvas#gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="gl" width="1920" height="1080"></canvas>
<script type="module">
// ───────────────────────── constants & easing ─────────────────────────
const W = 1920, H = 1080, FPS = 60, SUB = 3, SUB_FPS = 180, DURATION = 40;
/** Camera samples per subframe: pans blur smoothly without capturing more footage. */
const CAM_SAMPLES = 4;
const DISPLAY = '"BubbledotICG-FinePos", "Geist Pixel Circle", monospace';
const SANS = "Inter, system-ui, sans-serif";
const MONO = 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace';
const EMERALD = "#10b981", EMERALD_LIGHT = "#34d399";

const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const expoOut = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : (1 - Math.pow(2, -10 * u)) / (1 - Math.pow(2, -10)));
const expoIn = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : (Math.pow(2, 10 * u) - 1) / 1023);
const cubicInOut = (u) => ((u = clamp(u)) < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const sineInOut = (u) => -(Math.cos(Math.PI * clamp(u)) - 1) / 2;
function spring(t, t0, dur, zeta = 0.7) {
  const tau = t - t0;
  if (tau <= 0) return 0;
  const wn = 4 / (zeta * dur), wd = wn * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * wn * tau) * (Math.cos(wd * tau) + ((zeta * wn) / wd) * Math.sin(wd * tau));
}
const hash = (n) => {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
};
/** Monotone cubic (Fritsch–Carlson) through [time, value] keys. */
function monotone(keys) {
  const n = keys.length, xs = keys.map((k) => k[0]), ys = keys.map((k) => k[1]);
  if (n === 1) return () => ys[0];
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0];
  m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
  }
  return (x) => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0;
    while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], u = (x - xs[i]) / h, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * m[i + 1];
  };
}

// ───────────────────────── the edit ─────────────────────────
// Segments map reel time onto captured shots (shot time = reel time − from). Offsets are multiples
// of 1/180 s, so every reel subframe lands exactly on a captured subframe.
const SEGMENTS = {
  title: { from: 0, to: 1.8 },
  P: { shot: "P", from: 1.3, to: 4.4 },
  H: { shot: "H", from: 3.8, to: 12.8 },
  W: { shot: "W", from: 12.35, to: 16.35 },
  S: { shot: "S", from: 15.4, to: 31.4 },
  M: { shot: "M", from: 30.75, to: 35.75 },
  E: { shot: "E", from: 35.0, to: 39.8 },
};
const CUTS = [
  { at: 1.3, dur: 0.45, kind: "led", a: "title", b: "P", dir: [1, 0.35] },
  { at: 3.85, dur: 0.6, kind: "dissolve", a: "P", b: "H" },
  { at: 12.35, dur: 0.42, kind: "beam", a: "H", b: "W" },
  { at: 15.5, dur: 0.72, kind: "iris", a: "W", b: "S", origin: ["W", "launch"] },
  { at: 30.75, dur: 0.5, kind: "led", a: "S", b: "M", dir: [-1, 0.3] },
  { at: 35.0, dur: 0.6, kind: "dissolve", a: "M", b: "E" },
];
const END = 39.5;

/**
 * Camera keys per segment: [reel time, cx, cy, zoom] in the shot's CSS pixels, or
 * [reel time, anchor, zoom, [dx, dy]] to centre on an element recorded during capture. Footage is
 * captured at 1.25x, so zooms up to 1.25 stay sharp; the view is kept inside the frame.
 */
const CAMERA = {
  title: [[0, 960, 540, 1]],
  P: [[1.3, 768, 470, 1.3], [2.7, 800, 480, 1.27], [3.45, 1152, 500, 1.24], [4.4, 1200, 520, 1.16]],
  H: [[3.8, 960, 540, 1.0], [5.8, 990, 540, 1.04], [7.6, 1030, 560, 1.07], [8.4, 1063, 596, 1.1], [9.6, 1070, 592, 1.11], [10.6, 1063, 596, 1.12], [12.8, 1200, 530, 1.26]],
  W: [[12.35, 768, 470, 1.25], [13.9, 1152, 470, 1.25], [14.6, 1100, 420, 1.12], [15.25, 960, 400, 1.06], [15.5, 1010, 380, 1.08], [16.35, 1030, 370, 1.1]],
  S: [
    [15.4, 960, 540, 1.0], [16.3, 960, 540, 1.02], [16.75, 780, 330, 1.2], [17.4, 780, 420, 1.2], [18.2, 780, 560, 1.18], [18.56, 780, 572, 1.18],
    [18.98, 1150, 330, 1.24], [20.2, 1140, 360, 1.22], [20.7, 1140, 470, 1.2], [22.6, 1140, 470, 1.18], [23.2, 1140, 420, 1.16],
    [26.8, 1150, 480, 1.14], [27.6, 800, 640, 1.16], [28.7, 800, 700, 1.18], [30.2, 760, 760, 1.26], [31.4, 760, 740, 1.3],
  ],
  M: [[30.75, 768, 432, 1.25], [32.4, 800, 432, 1.24], [33.6, 960, 560, 1.06], [35.75, 960, 600, 1.12]],
  E: [[35, 900, 540, 1.0], [39.8, 870, 540, 1.05]],
};

// ───────────────────────── footage ─────────────────────────
const META = {};
const SHOT_IDS = [...new Set(Object.values(SEGMENTS).map((s) => s.shot).filter(Boolean))];

function shotIndex(seg, T) {
  const meta = META[seg.shot];
  return clamp(Math.round((T - seg.from) * SUB_FPS), 0, meta.frames.length - 1);
}
/** An anchor's rect [x, y, w, h] in a segment's shot at reel time T (from the nearest recorded frame). */
function anchorAt(segId, name, T) {
  const seg = SEGMENTS[segId], frames = META[seg.shot].frames;
  let i = shotIndex(seg, T);
  i -= i % 3;
  for (let k = i; k >= 0; k -= 3) if (frames[k].a && frames[k].a[name]) return frames[k].a[name];
  for (let k = i; k < frames.length; k += 3) if (frames[k].a && frames[k].a[name]) return frames[k].a[name];
  return null;
}

// Camera paths, built once the metas (and their anchors) are loaded.
const CAM = {};
function buildCameras() {
  for (const [segId, keys] of Object.entries(CAMERA)) {
    const pts = keys.map((k) => {
      if (typeof k[1] === "string") {
        const r = anchorAt(segId, k[1], k[0]);
        const [dx, dy] = k[3] ?? [0, 0];
        return [k[0], r ? r[0] + r[2] / 2 + dx : 960, r ? r[1] + r[3] / 2 + dy : 540, k[2]];
      }
      return k;
    });
    const fx = monotone(pts.map((p) => [p[0], p[1]]));
    const fy = monotone(pts.map((p) => [p[0], p[2]]));
    const fz = monotone(pts.map((p) => [p[0], p[3]]));
    CAM[segId] = (T) => {
      const z = Math.max(1, fz(T));
      const hw = 960 / z, hh = 540 / z;
      return [clamp(fx(T), hw, W - hw), clamp(fy(T), hh, H - hh), z];
    };
  }
}
const toScreen = (cam, x, y) => [(x - cam[0]) * cam[2] + 960, (y - cam[1]) * cam[2] + 540];

// ───────────────────────── overlays (2D canvas per side of a transition) ─────────────────────────
const overlayCanvases = [0, 1].map(() => {
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  return c;
});

/** The pointer, as the site's own recordings draw it: a white dot with an emerald ring. */
function drawCursor(g, segId, T, cam) {
  const seg = SEGMENTS[segId];
  if (!seg.shot) return;
  const frames = META[seg.shot].frames;
  const i = shotIndex(seg, T);
  const f = frames[i];
  if (!f || !f.m) return;
  // appear: how long it has been on screen
  let shown = 0;
  for (let k = i; k >= 0 && frames[k].m; k--) shown++;
  const appear = clamp(spring(shown / SUB_FPS, 0, 0.35), 0, 1.06);
  const [x, y] = toScreen(cam, f.m[0], f.m[1]);
  // time since the last press began, for the ripple
  let pressAge = Infinity;
  for (let k = i; k >= Math.max(0, i - SUB_FPS); k--) {
    if (frames[k].m && frames[k].m[2] && (k === 0 || !frames[k - 1].m || !frames[k - 1].m[2])) {
      pressAge = (i - k) / SUB_FPS;
      break;
    }
  }
  const pressed = f.m[2] === 1;
  const r = (pressed ? 6.5 : 9.5) * appear * Math.max(1, cam[2] * 0.9);
  if (pressAge < 0.5) {
    const u = pressAge / 0.5;
    g.beginPath();
    g.arc(x, y, r + 46 * expoOut(u), 0, Math.PI * 2);
    g.strokeStyle = `rgba(52, 211, 153, ${0.55 * (1 - u)})`;
    g.lineWidth = 2.5;
    g.stroke();
  }
  g.save();
  g.shadowColor = "rgba(0, 0, 0, 0.55)";
  g.shadowBlur = 10;
  g.shadowOffsetY = 2;
  g.beginPath();
  g.arc(x, y, r + 3, 0, Math.PI * 2);
  g.fillStyle = "rgba(16, 185, 129, 0.62)";
  g.fill();
  g.restore();
  g.beginPath();
  g.arc(x, y, r, 0, Math.PI * 2);
  g.fillStyle = "rgba(255, 255, 255, 0.95)";
  g.fill();
}

/** LED title on an unlit dot panel: characters flicker on like a matrix display. */
function drawTitle(g, T) {
  // the unlit panel
  const pitch = 14;
  const glow = 0.05 + 0.02 * Math.sin(T * 3);
  g.fillStyle = `rgba(52, 211, 153, ${glow})`;
  for (let y = pitch / 2; y < H; y += pitch) for (let x = pitch / 2; x < W; x += pitch) g.fillRect(x - 1, y - 1, 2, 2);
  const lines = [
    { text: "NDA SAYS", at: 0.0, color: "#e8fff6", y: 470 },
    { text: "NO CLOUD.", at: 0.5, color: EMERALD_LIGHT, y: 640 },
  ];
  g.textBaseline = "alphabetic";
  g.font = `400 168px ${DISPLAY}`;
  for (const line of lines) {
    const width = g.measureText(line.text).width;
    let x = 960 - width / 2;
    [...line.text].forEach((ch, i) => {
      const t0 = line.at + i * 0.035;
      const local = T - t0;
      const w = g.measureText(ch).width;
      if (local > 0) {
        // a few hard flickers, then steady
        const flick = local < 0.16 ? (hash(i * 13 + Math.floor(local * 90) + line.y) > 0.45 ? 1 : 0.15) : 1;
        g.save();
        g.globalAlpha = flick;
        g.shadowColor = line.color === EMERALD_LIGHT ? "rgba(16, 185, 129, 0.85)" : "rgba(232, 255, 246, 0.35)";
        g.shadowBlur = 26;
        g.fillStyle = line.color;
        g.fillText(ch, x, line.y);
        g.restore();
      }
      x += w;
    });
  }
  // a mono caption types in under the lines
  const caption = "CLIENT SPECS STAY ON THE LAPTOP";
  const shown = Math.floor(clamp((T - 0.95) / 0.4) * caption.length);
  if (shown > 0) {
    g.font = `500 22px ${MONO}`;
    g.fillStyle = "rgba(156, 163, 175, 0.9)";
    g.textAlign = "center";
    g.fillText(caption.slice(0, shown).split("").join(" "), 960, 730);
    g.textAlign = "left";
  }
}

const SHIELD_PATH = new Path2D("M16 2.6 27 7.2v9.6c0 1 -.45 1.95 -1.2 2.6L16 29.4 6.2 19.4A3.5 3.5 0 0 1 5 16.8V7.2L16 2.6Z");
function drawShieldMark(g, x, y, size, alpha) {
  const s = size / 32;
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  g.globalAlpha = alpha;
  const grad = g.createLinearGradient(6, 3, 26, 29);
  grad.addColorStop(0, EMERALD_LIGHT);
  grad.addColorStop(1, "#059669");
  g.fillStyle = "rgba(16, 185, 129, 0.16)";
  g.fill(SHIELD_PATH);
  g.strokeStyle = grad;
  g.lineWidth = 1.8;
  g.lineJoin = "round";
  g.stroke(SHIELD_PATH);
  g.beginPath();
  g.ellipse(16, 14.6, 3.7, 4.5, 0, 0, Math.PI * 2);
  g.stroke();
  g.restore();
}

/** End card: the brand lockup to the left of the forming shield, mirroring the landing hero. */
function drawEndCard(g, T) {
  const x0 = 210;
  const reveal = (t0, dur = 0.55) => expoOut(prog(T, t0, t0 + dur));
  // brand row
  const b = reveal(35.75);
  if (b > 0) {
    drawShieldMark(g, x0, 352 - 8 * (1 - b), 64, b);
    g.save();
    g.globalAlpha = b;
    g.font = `700 46px ${SANS}`;
    g.letterSpacing = "6px";
    g.fillStyle = "#ffffff";
    g.fillText("SPECSHIELD", x0 + 88, 400 - 8 * (1 - b));
    const ww = g.measureText("SPECSHIELD").width;
    g.letterSpacing = "2px";
    g.font = `700 22px ${SANS}`;
    const qx = x0 + 88 + ww + 18;
    g.strokeStyle = "rgba(52, 211, 153, 0.7)";
    g.lineWidth = 2;
    g.beginPath();
    g.roundRect(qx, 366 - 8 * (1 - b), 54, 36, 7);
    g.stroke();
    g.fillStyle = EMERALD_LIGHT;
    g.fillText("QA", qx + 12, 393 - 8 * (1 - b));
    g.restore();
  }
  // tagline in the display face, white to emerald like the site's gradient text
  [
    ["KEEP THE SPEC.", 36.15, 548],
    ["SHIP THE SUITE.", 36.45, 650],
  ].forEach(([text, t0, y]) => {
    const u = reveal(t0, 0.7);
    if (u <= 0) return;
    g.save();
    g.font = `400 84px ${DISPLAY}`;
    const grad = g.createLinearGradient(0, y - 80, 0, y + 10);
    grad.addColorStop(0.3, "#ffffff");
    grad.addColorStop(1, EMERALD_LIGHT);
    g.fillStyle = grad;
    g.shadowColor = "rgba(16, 185, 129, 0.45)";
    g.shadowBlur = 24;
    const width = g.measureText(text).width;
    g.beginPath();
    g.rect(x0 - 10, y - 110, (width + 40) * u, 140);
    g.clip();
    g.fillText(text, x0, y);
    g.restore();
  });
  const s = reveal(37.0);
  if (s > 0) {
    g.save();
    g.globalAlpha = s;
    g.font = `400 27px ${SANS}`;
    g.fillStyle = "rgba(229, 231, 235, 0.86)";
    g.fillText("100% offline · zero cloud calls · $0.00 token cost", x0, 726 + 8 * (1 - s));
    g.restore();
  }
  const u = reveal(37.5);
  if (u > 0) {
    g.save();
    g.globalAlpha = u;
    g.font = `500 23px ${MONO}`;
    g.fillStyle = "rgba(52, 211, 153, 0.9)";
    g.fillText("github.com/AaronStark1/specshield-qa", x0, 790 + 8 * (1 - u));
    g.restore();
  }
}

function drawOverlay(canvas, segId, T, cam) {
  const g = canvas.getContext("2d");
  g.clearRect(0, 0, W, H);
  if (!segId) return;
  if (segId === "title") drawTitle(g, T);
  if (segId === "E") drawEndCard(g, T);
  drawCursor(g, segId, T, cam);
}

// ───────────────────────── WebGL ─────────────────────────
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true, alpha: false });
if (!gl.getExtension("EXT_color_buffer_float")) throw new Error("EXT_color_buffer_float is required");

const VERT = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const COMMON = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
const vec2 RES = vec2(1920.0, 1080.0);
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; } return v; }
`;

// One subframe: shot A and shot B through their cameras, their overlays, and the transition between them.
const SCENE_FRAG = COMMON + `
uniform sampler2D uA, uB, uOA, uOB;
uniform vec3 uCamA, uCamB;
uniform int uHasA, uHasB, uMode;
uniform float uP, uWeight, uTime;
uniform vec4 uParam;
const vec3 EM = vec3(0.204, 0.827, 0.6);
vec3 shot(sampler2D tex, vec3 cam, vec2 px, float has) {
  if (has < 0.5) return vec3(0.0);
  vec2 css = (px - RES * 0.5) / cam.z + cam.xy;
  vec2 uv = css / RES;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) return vec3(0.0);
  return texture(tex, uv).rgb;
}
vec3 layer(sampler2D tex, sampler2D ov, vec3 cam, vec2 px, float has) {
  vec3 c = shot(tex, cam, px, has);
  vec4 o = texture(ov, px / RES);
  return c * (1.0 - o.a) + o.rgb;
}
// signed distance to the SpecShield shield (the logo's outline), unit size
float shieldSdf(vec2 p) {
  vec2 v[8] = vec2[8](vec2(0.0, -1.0), vec2(0.821, -0.657), vec2(0.821, 0.06), vec2(0.731, 0.254), vec2(0.0, 1.0), vec2(-0.731, 0.254), vec2(-0.821, 0.06), vec2(-0.821, -0.657));
  float d = -1e9;
  for (int i = 0; i < 8; i++) {
    vec2 a = v[i], b = v[(i + 1) % 8];
    vec2 e = normalize(b - a);
    vec2 n = vec2(e.y, -e.x);
    d = max(d, dot(p - a, n));
  }
  return d;
}
void main() {
  vec2 px = vec2(vUv.x, 1.0 - vUv.y) * RES;
  vec3 col;
  if (uMode == 0) {
    col = layer(uA, uOA, uCamA, px, float(uHasA));
  } else if (uMode == 1) {
    // LED dot-matrix wipe: cells flip from A to B along a direction, lighting an emerald LED as they turn
    float cell = 18.0;
    vec2 id = floor(px / cell);
    vec2 c = (id + 0.5) * cell;
    vec2 dir = normalize(uParam.xy);
    float along = dot(c / RES - 0.5, dir) / (abs(dir.x) * 0.5 + abs(dir.y) * 0.5) * 0.5 + 0.5;
    float tau = along * 0.72 + hash12(id) * 0.2;
    float q = clamp((uP * 1.1 - tau) / 0.16, 0.0, 1.0);
    vec3 a = layer(uA, uOA, uCamA, px, float(uHasA));
    vec3 b = layer(uB, uOB, uCamB, px, float(uHasB));
    col = q < 0.5 ? a * (1.0 - q * 1.4) : b * (0.3 + (q - 0.5) * 1.4);
    float led = sin(3.14159 * q);
    float d = length(px - c) / (cell * 0.5);
    col += EM * led * smoothstep(0.82, 0.35, d) * 1.1 + EM * led * 0.08;
  } else if (uMode == 2) {
    // particle dissolve: A burns away along noise into glowing emerald embers, revealing B
    float n = fbm(px / 140.0) * 0.75 + hash12(floor(px / 3.0)) * 0.25;
    float t = uP * 1.25 - 0.12;
    vec2 lift = vec2(0.0, -40.0 * uP * smoothstep(t - 0.25, t, n));
    vec3 a = layer(uA, uOA, uCamA, px - lift, float(uHasA));
    vec3 b = layer(uB, uOB, uCamB, px, float(uHasB));
    float edge = n - t;
    col = edge < 0.0 ? b : a;
    float rim = smoothstep(0.06, 0.0, abs(edge));
    col += EM * rim * 1.6 * (0.6 + 0.4 * hash12(floor(px / 2.0) + floor(uTime * 60.0)));
  } else if (uMode == 3) {
    // scanner beam: a horizontal emerald scanline sweeps down; behind it is the next scene
    float y = mix(-120.0, RES.y + 120.0, uP);
    float dy = px.y - y;
    float wob = (noise(vec2(px.y * 0.05, uTime * 40.0)) - 0.5) * 34.0 * exp(-abs(dy) / 60.0);
    vec3 a = layer(uA, uOA, uCamA, px + vec2(wob, 0.0), float(uHasA));
    vec3 b = layer(uB, uOB, uCamB, px + vec2(wob, 0.0), float(uHasB));
    col = dy < 0.0 ? b : a;
    // fading scanlines just behind the beam
    float behind = clamp(-dy / 220.0, 0.0, 1.0);
    if (dy < 0.0) col *= 1.0 - 0.35 * (1.0 - behind) * step(0.5, fract(px.y / 4.0));
    col += EM * (exp(-abs(dy) / 2.5) * 1.6 + exp(-abs(dy) / 40.0) * 0.45);
  } else {
    // shield portal: B opens inside the SpecShield shield from an origin, with an emerald rim
    vec2 o = uParam.xy;
    // the radius never reaches zero: a zero-size field would put every pixel on the rim
    float r = max(uParam.z * uP, 0.5);
    float d = shieldSdf((px - o) / r) * r;
    float pa = 1.0 + 0.1 * uP, pb = 1.0 + 0.12 * (1.0 - uP);
    vec3 a = layer(uA, uOA, uCamA, o + (px - o) / pa, float(uHasA));
    vec3 b = layer(uB, uOB, uCamB, o + (px - o) / pb, float(uHasB));
    col = d < 0.0 ? b : a * (1.0 - 0.45 * uP);
    col += EM * (exp(-abs(d) / 2.0) * 1.4 + exp(-max(d, 0.0) / 36.0) * 0.35 * step(0.0, d));
  }
  outColor = vec4(col * uWeight, 1.0);
}`;

// Final: the averaged subframes, a soft emerald bloom and a vignette. (No film grain: per-frame
// noise is incompressible and multiplied the encoded size for an effect x264 then smears away.)
const BRIGHT_FRAG = COMMON + `
uniform sampler2D uSrc;
void main() { vec3 c = texture(uSrc, vUv).rgb; float m = max(max(c.r, c.g), c.b); outColor = vec4(c * smoothstep(0.62, 1.0, m), 1.0); }`;
const BLUR_FRAG = COMMON + `
uniform sampler2D uSrc; uniform vec2 uDir;
void main() {
  vec3 s = vec3(0.0); float w[5] = float[5](0.227, 0.195, 0.122, 0.054, 0.016);
  s += texture(uSrc, vUv).rgb * w[0];
  for (int i = 1; i < 5; i++) { s += texture(uSrc, vUv + uDir * float(i)).rgb * w[i]; s += texture(uSrc, vUv - uDir * float(i)).rgb * w[i]; }
  outColor = vec4(s, 1.0);
}`;
const FINAL_FRAG = COMMON + `
uniform sampler2D uAcc, uBloom; uniform float uFrame, uBlack;
void main() {
  vec3 c = texture(uAcc, vUv).rgb + texture(uBloom, vUv).rgb * 0.32;
  vec2 q = (vUv - 0.5) * vec2(1.0, 0.82);
  c *= 1.0 - 0.2 * smoothstep(0.32, 0.78, length(q));
  outColor = vec4(c * (1.0 - uBlack + 0.0 * uFrame), 1.0);
}`;

function compile(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(frag) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(VERT, gl.VERTEX_SHADER));
  gl.attachShader(p, compile(frag, gl.FRAGMENT_SHADER));
  gl.bindAttribLocation(p, 0, "aPos");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, "");
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}
const progScene = program(SCENE_FRAG), progBright = program(BRIGHT_FRAG), progBlur = program(BLUR_FRAG), progFinal = program(FINAL_FRAG);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function texture({ mip = false } = {}) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function target(w, h, format = gl.RGBA16F) {
  const tex = texture();
  gl.texImage2D(gl.TEXTURE_2D, 0, format, w, h, 0, gl.RGBA, format === gl.RGBA16F ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb, w, h };
}
const acc = target(W, H), half1 = target(W / 2, H / 2), half2 = target(W / 2, H / 2);
const shotTex = [texture({ mip: true }), texture({ mip: true })];
const ovTex = [texture(), texture()];

function upload(tex, source, mip) {
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, !mip);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, source);
  if (mip) gl.generateMipmap(gl.TEXTURE_2D);
}
function bindTex(unit, tex) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
}
function draw(prog, fb, w, h) {
  gl.useProgram(prog.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.viewport(0, 0, w, h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ───────────────────────── frame assembly ─────────────────────────
const MODES = { led: 1, dissolve: 2, beam: 3, iris: 4 };

/** What is on screen at reel time T: one segment, or two with a transition between them. */
function sceneAt(T) {
  let current = "title";
  for (const c of CUTS) {
    if (T < c.at) break;
    if (T < c.at + c.dur) return { a: c.a, b: c.b, cut: c, p: (T - c.at) / c.dur };
    current = c.b;
  }
  return { a: current, b: null, cut: null, p: 0 };
}

async function loadBitmap(segId, T) {
  const seg = SEGMENTS[segId];
  if (!seg || !seg.shot) return null;
  const i = shotIndex(seg, T);
  const res = await fetch(`out/shots/${seg.shot}/${String(i).padStart(5, "0")}.jpg`);
  if (!res.ok) throw new Error(`missing frame ${seg.shot}/${i}`);
  return createImageBitmap(await res.blob(), { colorSpaceConversion: "none", premultiplyAlpha: "none" });
}

function transitionParams(scene, T) {
  const c = scene.cut;
  if (!c) return [0, 0, 0, 0];
  if (c.kind === "led") return [c.dir[0], c.dir[1], 0, 0];
  if (c.kind === "iris") {
    const r = anchorAt(c.origin[0], c.origin[1], T);
    const cam = CAM[c.origin[0]](T);
    const [ox, oy] = r ? toScreen(cam, r[0] + r[2] / 2, r[1] + r[3] / 2) : [960, 540];
    const reach = Math.max(Math.hypot(ox, oy), Math.hypot(W - ox, oy), Math.hypot(ox, H - oy), Math.hypot(W - ox, H - oy));
    return [ox, oy, reach * 1.45, 0];
  }
  return [0, 0, 0, 0];
}
// The portal opens slowly around its origin, then rushes past the frame's corners.
const EASE = { led: (u) => u, dissolve: (u) => sineInOut(u), beam: (u) => cubicInOut(u), iris: (u) => Math.pow(cubicInOut(u), 1.6) };

async function renderSubframe(T) {
  const scene = sceneAt(T);
  const [ba, bb] = await Promise.all([loadBitmap(scene.a, T), scene.b ? loadBitmap(scene.b, T) : null]);
  if (ba) upload(shotTex[0], ba, true);
  if (bb) upload(shotTex[1], bb, true);
  ba?.close();
  bb?.close();
  drawOverlay(overlayCanvases[0], scene.a, T, CAM[scene.a](T));
  drawOverlay(overlayCanvases[1], scene.b, T, scene.b ? CAM[scene.b](T) : [960, 540, 1]);
  upload(ovTex[0], overlayCanvases[0], false);
  upload(ovTex[1], overlayCanvases[1], false);

  const u = progScene.u;
  gl.useProgram(progScene.p);
  bindTex(0, shotTex[0]);
  bindTex(1, shotTex[1]);
  bindTex(2, ovTex[0]);
  bindTex(3, ovTex[1]);
  gl.uniform1i(u.uA, 0);
  gl.uniform1i(u.uB, 1);
  gl.uniform1i(u.uOA, 2);
  gl.uniform1i(u.uOB, 3);
  gl.uniform1i(u.uHasA, ba ? 1 : 0);
  gl.uniform1i(u.uHasB, bb ? 1 : 0);
  gl.uniform1i(u.uMode, scene.cut ? MODES[scene.cut.kind] : 0);
  gl.uniform1f(u.uWeight, 1 / (SUB * CAM_SAMPLES));
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  for (let k = 0; k < CAM_SAMPLES; k++) {
    const Tc = T + ((k + 0.5) / CAM_SAMPLES - 0.5) / SUB_FPS;
    gl.uniform3f(u.uCamA, ...CAM[scene.a](Tc));
    gl.uniform3f(u.uCamB, ...(scene.b ? CAM[scene.b](Tc) : [960, 540, 1]));
    gl.uniform1f(u.uP, scene.cut ? EASE[scene.cut.kind](clamp((Tc - scene.cut.at) / scene.cut.dur)) : 0);
    gl.uniform4f(u.uParam, ...transitionParams(scene, Tc));
    gl.uniform1f(u.uTime, Tc);
    draw(progScene, acc.fb, W, H);
  }
  gl.disable(gl.BLEND);
}

async function renderFrame(k) {
  const t = k / FPS;
  gl.bindFramebuffer(gl.FRAMEBUFFER, acc.fb);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  const black = t >= END ? 1 : 0;
  if (!black) for (let s = 0; s < SUB; s++) await renderSubframe(Math.max(0, t + (s - (SUB - 1) / 2) / SUB_FPS));

  bindTex(0, acc.tex);
  gl.uniform1i(progBright.u.uSrc, 0);
  draw(progBright, half1.fb, half1.w, half1.h);
  for (const [src, dst, dir] of [[half1, half2, [1 / half1.w, 0]], [half2, half1, [0, 1 / half1.h]], [half1, half2, [2 / half1.w, 0]], [half2, half1, [0, 2 / half1.h]]]) {
    gl.useProgram(progBlur.p);
    bindTex(0, src.tex);
    gl.uniform1i(progBlur.u.uSrc, 0);
    gl.uniform2f(progBlur.u.uDir, ...dir);
    draw(progBlur, dst.fb, dst.w, dst.h);
  }
  gl.useProgram(progFinal.p);
  bindTex(0, acc.tex);
  bindTex(1, half1.tex);
  gl.uniform1i(progFinal.u.uAcc, 0);
  gl.uniform1i(progFinal.u.uBloom, 1);
  gl.uniform1f(progFinal.u.uFrame, k);
  gl.uniform1f(progFinal.u.uBlack, black);
  draw(progFinal, null, W, H);
  gl.finish();
  return k;
}

// ───────────────────────── boot ─────────────────────────
async function boot() {
  for (const id of SHOT_IDS) META[id] = await (await fetch(`out/shots/${id}/meta.json`)).json();
  buildCameras();
  await Promise.all([document.fonts.load(`400 40px ${DISPLAY}`), document.fonts.load(`700 40px ${SANS}`), document.fonts.load(`500 20px ${MONO}`)]);
  window.displayFace = document.fonts.check('40px "BubbledotICG-FinePos"') ? "BubbledotICG-FinePos" : "Geist Pixel Circle";
  window.renderFrame = renderFrame;
  window.renderAudio = () => import("./lib/score.js").then((m) => m.renderScore());
  window.FRAMES = Math.round(DURATION * FPS);
  window.__ready = true;
}
boot().catch((e) => {
  window.__error = String(e.stack || e);
  console.error(e);
});
</script>
